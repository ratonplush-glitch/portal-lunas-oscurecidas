<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta name="robots" content="noindex,nofollow">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Panel de Administración</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#0f172a;
    color:white;
}

header{
    background:#1e293b;
    padding:20px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header h1{
    font-size:30px;
}

.cerrar{
    background:#dc2626;
    border:none;
    padding:12px 22px;
    color:white;
    font-weight:bold;
    border-radius:8px;
    cursor:pointer;
}

.contenedor{
    width:95%;
    margin:25px auto;
}

h2{
    margin-bottom:15px;
}

form{
    background:#1e293b;
    padding:20px;
    border-radius:10px;
    margin-bottom:25px;
}

input[type=file]{
    margin-bottom:15px;
}

button{
    padding:12px 22px;
    background:#2563eb;
    border:none;
    color:white;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#1d4ed8;
}

#resultado{
    margin-top:20px;
    margin-bottom:30px;
    padding:15px;
    background:#1e293b;
    border-radius:10px;
    white-space:pre-wrap;
    word-break:break-word;
}

.tarjetas{
    display:grid;
    grid-template-columns:repeat(
        auto-fit,
        minmax(240px,1fr)
    );
    gap:20px;
}

.card{
    background:#1e293b;
    padding:35px;
    border-radius:12px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.card:hover{
    background:#2563eb;
    transform:translateY(-5px);
}

.panelTabla{
    display:none;
    margin-top:35px;
    background:#1e293b;
    padding:20px;
    border-radius:10px;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

table th{
    background:#2563eb;
    padding:12px;
    white-space:nowrap;
}

table td{
    padding:12px;
    border-bottom:1px solid #444;
}

.btnEditar{
    background:#16a34a;
    margin-right:5px;
}

.btnEliminar{
    background:#dc2626;
}

.btnNuevo{
    background:#2563eb;
    margin-bottom:15px;
}

</style>

</head>

<body>

<header>

<h1>PORTAL DE LUNAS OSCURECIDAS</h1>

<button
    class="cerrar"
    type="button"
    onclick="salir()"
>
    Cerrar sesión
</button>

</header>


<div class="contenedor">

<h2>IMPORTAR CERTIFICADO PDF</h2>

<form id="formPDF">

<input
    type="file"
    id="archivoPDF"
    accept=".pdf,application/pdf"
    required
>

<br>

<button
    type="submit"
>
    IMPORTAR PDF
</button>

</form>


<div id="resultado"></div>


<div class="tarjetas">

<div
    class="card"
    onclick="cargarUsuarios()"
>
    👤 Usuarios
</div>

<div class="card">
    🔍 Consultas
</div>

<div class="card">
    🚗 Vehículos
</div>

<div
    class="card"
    onclick="location.href='/lunas'"
>
    🕶 Lunas Oscurecidas
</div>

<div class="card">
    📊 Reportes
</div>

<div class="card">
    ⚙ Configuración
</div>

</div>


<div
    class="panelTabla"
    id="panelUsuarios"
>

<h2>Usuarios Registrados</h2>

<button
    class="btnNuevo"
    type="button"
    onclick="nuevoUsuario()"
>
    + Nuevo Usuario
</button>


<table>

<thead>

<tr>

<th>ID</th>
<th>Usuario</th>
<th>Nombre</th>
<th>Correo</th>
<th>Rol</th>
<th>Estado</th>
<th>Acciones</th>

</tr>

</thead>

<tbody id="tablaUsuarios">

</tbody>

</table>

</div>

</div>


<script>

/*
|--------------------------------------------------------------------------
| AUTENTICACIÓN
|--------------------------------------------------------------------------
|
| El login principal utiliza JWT.
| Primero buscamos el token en localStorage.
| Como respaldo, revisamos sessionStorage.
|
|--------------------------------------------------------------------------
*/

function obtenerToken(){

    const localToken =
        localStorage.getItem("token");

    if(localToken){
        return localToken;
    }

    const sessionToken =
        sessionStorage.getItem("token");

    if(sessionToken){
        return sessionToken;
    }

    return "";
}


let token = obtenerToken();


/*
|--------------------------------------------------------------------------
| VERIFICAR SESIÓN
|--------------------------------------------------------------------------
*/

if(!token){

    location.replace("/index.html");

}


/*
|--------------------------------------------------------------------------
| HEADERS DE AUTENTICACIÓN
|--------------------------------------------------------------------------
*/

function authHeaders(extra = {}){

    const actualToken =
        obtenerToken();

    return {
        Authorization:
            "Bearer " + actualToken,

        ...extra
    };

}


/*
|--------------------------------------------------------------------------
| CERRAR SESIÓN
|--------------------------------------------------------------------------
*/

function salir(){

    localStorage.removeItem("token");

    sessionStorage.removeItem("token");

    sessionStorage.removeItem("admin");

    location.replace("/index.html");

}


/*
|--------------------------------------------------------------------------
| MANEJO DE SESIÓN INVÁLIDA
|--------------------------------------------------------------------------
*/

function sesionInvalida(){

    localStorage.removeItem("token");

    sessionStorage.removeItem("token");

    sessionStorage.removeItem("admin");

    location.replace("/index.html");

}


/*
|--------------------------------------------------------------------------
| LEER RESPUESTA DEL SERVIDOR
|--------------------------------------------------------------------------
*/

async function leerRespuesta(r){

    const texto =
        await r.text();

    if(!texto){

        return {};

    }

    try{

        return JSON.parse(texto);

    }catch{

        return {
            ok:false,
            mensaje: texto
        };

    }

}


/*
|--------------------------------------------------------------------------
| IMPORTAR PDF
|--------------------------------------------------------------------------
*/

document
    .getElementById("formPDF")
    .addEventListener(
        "submit",
        async(e)=>{

            e.preventDefault();

            const archivo =
                document
                    .getElementById("archivoPDF")
                    .files[0];


            if(!archivo){

                alert(
                    "Seleccione un archivo PDF."
                );

                return;

            }


            const datos =
                new FormData();

            datos.append(
                "archivo",
                archivo
            );


            const resultado =
                document
                    .getElementById("resultado");


            resultado.textContent =
                "Procesando PDF...";


            try{

                const r =
                    await fetch(
                        "/api/importar/pdf",
                        {
                            method:"POST",

                            headers:
                                authHeaders(),

                            body:datos
                        }
                    );


                if(
                    r.status === 401 ||
                    r.status === 403
                ){

                    sesionInvalida();

                    return;

                }


                const j =
                    await leerRespuesta(r);


                resultado.textContent =
                    JSON.stringify(
                        j,
                        null,
                        2
                    );


                if(j.ok){

                    document
                        .getElementById(
                            "formPDF"
                        )
                        .reset();

                }

            }catch(error){

                resultado.textContent =
                    "Error de conexión: " +
                    error.message;

            }

        }
    );


/*
|--------------------------------------------------------------------------
| CARGAR USUARIOS
|--------------------------------------------------------------------------
*/

async function cargarUsuarios(){

    const panel =
        document.getElementById(
            "panelUsuarios"
        );

    panel.style.display =
        "block";


    const tabla =
        document.getElementById(
            "tablaUsuarios"
        );

    tabla.innerHTML =
        "<tr><td colspan='7'>Cargando usuarios...</td></tr>";


    try{

        const r =
            await fetch(
                "/api/usuarios",
                {
                    method:"GET",

                    headers:
                        authHeaders()
                }
            );


        if(
            r.status === 401 ||
            r.status === 403
        ){

            sesionInvalida();

            return;

        }


        const datos =
            await leerRespuesta(r);


        if(!r.ok){

            tabla.innerHTML =
                "<tr><td colspan='7'>" +
                (
                    datos.mensaje ||
                    "No se pudieron cargar los usuarios."
                ) +
                "</td></tr>";

            return;

        }


        let html = "";


        (datos.usuarios || [])
            .forEach(u=>{

                const id =
                    String(
                        u.id || ""
                    );


                const usuario =
                    String(
                        u.usuario || ""
                    );

                const nombre =
                    String(
                        u.nombre || ""
                    );

                const correo =
                    String(
                        u.correo || ""
                    );

                const rol =
                    String(
                        u.rol || ""
                    );

                const estado =
                    String(
                        u.estado ?? ""
                    );


                html += `

<tr>

<td>${escapeHTML(id)}</td>

<td>${escapeHTML(usuario)}</td>

<td>${escapeHTML(nombre)}</td>

<td>${escapeHTML(correo)}</td>

<td>${escapeHTML(rol)}</td>

<td>${escapeHTML(estado)}</td>

<td>

<button
    class="btnEditar"
    type="button"
    onclick="editarUsuario('${escapeJS(id)}')"
>
    Editar
</button>

<button
    class="btnEliminar"
    type="button"
    onclick="eliminarUsuario('${escapeJS(id)}')"
>
    Eliminar
</button>

</td>

</tr>

`;

            });


        if(!html){

            html =
                "<tr><td colspan='7'>" +
                "No hay usuarios registrados." +
                "</td></tr>";

        }


        tabla.innerHTML =
            html;


    }catch(error){

        tabla.innerHTML =
            "<tr><td colspan='7'>" +
            "Error de conexión: " +
            escapeHTML(error.message) +
            "</td></tr>";

    }

}


/*
|--------------------------------------------------------------------------
| ESCAPAR HTML
|--------------------------------------------------------------------------
*/

function escapeHTML(valor){

    return String(valor)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/*
|--------------------------------------------------------------------------
| ESCAPAR JAVASCRIPT
|--------------------------------------------------------------------------
*/

function escapeJS(valor){

    return String(valor)
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'");

}


/*
|--------------------------------------------------------------------------
| NUEVO USUARIO
|--------------------------------------------------------------------------
*/

async function nuevoUsuario(){

    const usuario =
        prompt(
            "Nuevo usuario:"
        );

    if(usuario === null){

        return;

    }


    if(!usuario.trim()){

        alert(
            "El usuario es obligatorio."
        );

        return;

    }


    const nombre =
        prompt(
            "Nombre:"
        );

    if(nombre === null){

        return;

    }


    const password =
        prompt(
            "Contraseña:"
        );

    if(password === null){

        return;

    }


    if(!password){

        alert(
            "La contraseña es obligatoria."
        );

        return;

    }


    try{

        const r =
            await fetch(
                "/api/usuarios",
                {
                    method:"POST",

                    headers:
                        authHeaders({
                            "Content-Type":
                                "application/json"
                        }),

                    body:
                        JSON.stringify({
                            usuario:
                                usuario.trim(),

                            nombre:
                                nombre.trim(),

                            password
                        })
                }
            );


        if(
            r.status === 401 ||
            r.status === 403
        ){

            sesionInvalida();

            return;

        }


        const j =
            await leerRespuesta(r);


        alert(
            j.mensaje ||
            "Operación terminada."
        );


        if(j.ok){

            cargarUsuarios();

        }


    }catch(error){

        alert(
            "Error de conexión: " +
            error.message
        );

    }

}


/*
|--------------------------------------------------------------------------
| ELIMINAR USUARIO
|--------------------------------------------------------------------------
*/

async function eliminarUsuario(id){

    if(
        !confirm(
            "¿Desea eliminar este usuario?"
        )
    ){

        return;

    }


    try{

        const r =
            await fetch(
                "/api/usuarios/" +
                encodeURIComponent(id),
                {
                    method:"DELETE",

                    headers:
                        authHeaders()
                }
            );


        if(
            r.status === 401 ||
            r.status === 403
        ){

            sesionInvalida();

            return;

        }


        const j =
            await leerRespuesta(r);


        alert(
            j.mensaje ||
            "Operación terminada."
        );


        if(j.ok){

            cargarUsuarios();

        }


    }catch(error){

        alert(
            "Error de conexión: " +
            error.message
        );

    }

}


/*
|--------------------------------------------------------------------------
| EDITAR USUARIO
|--------------------------------------------------------------------------
*/

async function editarUsuario(id){

    const usuario =
        prompt(
            "Editar usuario:"
        );

    if(usuario === null){

        return;

    }


    const nombre =
        prompt(
            "Nuevo nombre:"
        );

    if(nombre === null){

        return;

    }


    const password =
        prompt(
            "Nueva contraseña:" +
            "\n" +
            "(Cancelar = conservar contraseña actual)"
        );


    const body = {

        usuario:
            usuario.trim(),

        nombre:
            nombre.trim()

    };


    if(password !== null){

        body.password =
            password;

    }


    try{

        const r =
            await fetch(
                "/api/usuarios/" +
                encodeURIComponent(id),
                {
                    method:"PUT",

                    headers:
                        authHeaders({
                            "Content-Type":
                                "application/json"
                        }),

                    body:
                        JSON.stringify(body)
                }
            );


        if(
            r.status === 401 ||
            r.status === 403
        ){

            sesionInvalida();

            return;

        }


        const j =
            await leerRespuesta(r);


        alert(
            j.mensaje ||
            "Operación terminada."
        );


        if(j.ok){

            cargarUsuarios();

        }


    }catch(error){

        alert(
            "Error de conexión: " +
            error.message
        );

    }

}

</script>

</body>
</html>
